name: zikr
description: A Flutter app for Quran and Zikr tracking
version: 2.1.1+5

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.2.8
  sqflite_common_ffi: ^2.3.0
  path_provider: ^2.0.14
  path: ^1.8.3
  intl: ^0.20.2
  flutter_local_notifications: ^17.1.2
  fl_chart: ^0.69.0
  csv: ^5.0.0
  provider: ^6.0.5
  lottie: ^2.7.0
  shared_preferences: ^2.2.0
  in_app_update: ^4.2.3
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/lottie/confetti.json
    - assets/quran_data.json
    - assets/images/image.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/image.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: "assets/images/image.png"
